#################################
### node + ogmios + indexer #####
#################################

  cardano-node-ogmios:
    image: ${CARDANO_NODE_OGMIOS_IMAGE}
    hostname: cardano-node
    #init: true
    platform: linux/x86_64
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 1000000
    logging:
      driver: "json-file"
      options:
        max-size: "400k"
        max-file: "10"
    ports:
      - ${OGMIOS_PORT:-1337}:1337
    environment:
      NETWORK: ${NETWORK}
      #SOCKET: "${CARDANO_NODE_HOME}/ipc/node.socket" 
      #UPDATE_CHECK: "N"
      #EXPORTED_CONFIG: "${CARDANO_NODE_HOME}/config"
    volumes:
      #- node-db:/db
      #- node-ipc:/ipc 
      # Uncomment if you want to use your own config files or the provided ones.
      # Current configs are also available at: https://book.world.dev.cardano.org/
      #- ./configs/cardano/config/network/${NETWORK}:/config
      - node-db:${CARDANO_NODE_HOME}/db
      - node-ipc:${CARDANO_NODE_HOME}/ipc
      - ./scripts/cardano-node-ogmios/:/scripts/

  cardano-db-sync:
    image:  ${CARDANO_DB_SYNC_IMAGE}
    platform: linux/x86_64
    hostname: cardano-db-sync
    # command: [
    #   "--config", "/config/cardano-db-sync/config.json",
    #   "--socket-path", "/node-ipc/node.socket"
    # ]
    environment:
      DB_SYNC_CONFIG: ${CARDANO_DB_SYNC_CONFIG:-/config/cardano-db-sync/config.json}
      #DISABLE_LEDGER: ${CARDANO_DB_SYNC_DISABLE_LEDGER}
      NETWORK: ${NETWORK}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432 # not using exposed ${POSTGRES_PORT} because using internal docker network connection 
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESTORE_SNAPSHOT: ${CARDANO_DB_SYNC_RESTORE_SNAPSHOT:-} # Now, if set, will read the file mounted on /snapshots/db-sync-bootstrap.tgz
      RESTORE_RECREATE_DB: N
      #EXTRA_DB_SYNC_ARGS: ${CARDANO_DB_SYNC_ARGS:-}
    healthcheck:
      # test: ["CMD-SHELL", "/scripts/lib/dbsync_healthcheck.sh"]
      test: ["CMD-SHELL", "/scripts/cardano-db-sync/healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 5000000
    depends_on:
      # Depend on both services to be started before starting.
      cardano-node-ogmios:
        condition: service_started
      postgress:
        condition: service_started
    volumes:
      - ./configs/cardano/config/network/${NETWORK}:/config:ro
      - db-sync-data:/var/lib/cexplorer
      - node-ipc:/node-ipc
      - ./scripts/:/scripts/
      - ${BACKUP_DIR}:/snapshots:ro
    restart: always
    stop_signal: SIGINT
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  postgress:
    hostname: ${POSTGRES_HOST}    
    #image: postgrest-extended:16.1-bullseye
    build:
      context: ./src/postgres
    volumes:
      # - postgresdb:/var/lib/postgresql/data # DEPRECATED in v18
      - postgresdb:/var/lib/postgresql
      - ./scripts/:/scripts/
      #- ./src/postgres/init_scripts:/docker-entrypoint-initdb.d
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}      
      # For init_postgres.sh variable placeholder system:
      DANDELION_POSTGREST_SCHEMA: ${DANDELION_POSTGREST_SCHEMA}
      CARDANO_SQL_SCHEMA: ${CARDANO_SQL_SCHEMA}
      #RPC_SCHEMA: ${RPC_SCHEMA} #Deprecated, use the ones down below:
      KOIOS_LITE_SCHEMA: ${KOIOS_LITE_SCHEMA}
      KOIOS_ARTIFACTS_SCHEMA: ${KOIOS_ARTIFACTS_SCHEMA}
    shm_size: '${POSTGRES_SHM_SIZE}'
    healthcheck:
      test:  ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 100  
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
      - -c
      - wal_level=${POSTGRES_WAL_LEVEL}
      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS}
      - -c
      - synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM}
      - -c
      - max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES}
      - -c
      - maintenance_io_concurrency=${POSTGRES_MAINTENANCE_IO_CONCURRENCY}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

#################################
##### cardano-graphql-mk2  #####
#################################


  cardano-graphql:
    image: ${CARDANO_GRAPHQL_IMAGE}
    hostname: cardano-graphql
    ports:
      - ${CARDANO_GRAPHQL_PORT:-4000}:4000
    depends_on:
      cardano-node-ogmios:
        condition: service_healthy
      postgress:
        condition: service_healthy
    restart: always
    environment:
      GRAPHILE_ENV: development
      CORS: true 

      CARDANO_GRAPHQL_PORT: 4000
      CARDANO_GRAPHQL_GRAPHQL_PATH: ${CARDANO_GRAPHQL_GRAPHQL_PATH}
      CARDANO_GRAPHQL_GRAPHQL_PLAYGROUND_STATIC_PATH: ${CARDANO_GRAPHQL_GRAPHQL_PLAYGROUND_STATIC_PATH}
      CARDANO_GRAPHQL_GRAPHQL_PLAYGROUND_PATH: ${CARDANO_GRAPHQL_GRAPHQL_PLAYGROUND_PATH}
      CARDANO_GRAPHQL_SERVER_URI: ${CARDANO_GRAPHQL_SERVER_URI}
      
      CARDANO_GRAPHQL_DLT: ${CARDANO_GRAPHQL_DLT}
      CARDANO_GRAPHQL_NETWORK: ${CARDANO_GRAPHQL_NETWORK}

      CARDANO_GRAPHQL_POSTGRES_URI: ${CARDANO_GRAPHQL_POSTGRES_URI}
      CARDANO_GRAPHQL_POSTGRES_ROLE: ${CARDANO_GRAPHQL_POSTGRES_ROLE}
      POSTGRES_MIGRATIONS_DIR: ${CARDANO_GRAPHQL_POSTGRES_MIGRATIONS_DIR}
      POSTGRES_MIGRATIONS_RESET_DIR: ${CARDANO_GRAPHQL_POSTGRES_MIGRATIONS_RESET_DIR}

      CARDANO_GRAPHQL_OGMIOS_URI: ${CARDANO_GRAPHQL_OGMIOS_URI}
      CARDANO_GRAPHQL_OGMIOS_MIN_SYNC: ${CARDANO_GRAPHQL_OGMIOS_MIN_SYNC}


      CARDANO_GRAPHQL_CORS: ${CARDANO_GRAPHQL_CORS}

      CARDANO_GRAPHQL_CACHE_ENABLE: ${CARDANO_GRAPHQL_CACHE_ENABLE:-true}
      CARDANO_GRAPHQL_CACHE_PUBLISH: ${CARDANO_GRAPHQL_CACHE_PUBLISH:-true}
      CARDANO_GRAPHQL_WHITELIST_ENABLE: ${CARDANO_GRAPHQL_WHITELIST_ENABLE:-false}
      CARDANO_GRAPHQL_WHITELIST_PUBLISH: ${CARDANO_GRAPHQL_WHITELIST_PUBLISH:-false}
      CARDANO_GRAPHQL_WHITELIST_UPDATE_MINS: ${CARDANO_GRAPHQL_WHITELIST_UPDATE_MINS:-15}
      CARDANO_GRAPHQL_WHITELIST_SOURCES: ${CARDANO_GRAPHQL_WHITELIST_SOURCES:-}


      CARDANO_GRAPHQL_DEBUG: ${CARDANO_GRAPHQL_DEBUG:-}
      CARDANO_GRAPHQL_GRAPHQL_PLAYGROUND_API_PATH: ${CARDANO_GRAPHQL_GRAPHQL_PLAYGROUND_API_PATH:-}
      CARDANO_GRAPHQL_GRAPHQL_EXPLAIN: ${CARDANO_GRAPHQL_GRAPHQL_EXPLAIN:-}
      CARDANO_GRAPHQL_CACHE_SIZE: ${CARDANO_GRAPHQL_CACHE_SIZE:-}
      CARDANO_GRAPHQL_WHITELIST_SIZE: ${CARDANO_GRAPHQL_WHITELIST_SIZE:-}
      CARDANO_GRAPHQL_WHITELIST_SOURCES_DEP_DEPTH: ${CARDANO_GRAPHQL_WHITELIST_SOURCES_DEP_DEPTH:-}
      CARDANO_GRAPHQL_WHITELIST_LEARN_MODE: ${CARDANO_GRAPHQL_WHITELIST_LEARN_MODE:-}
    
    volumes:
      - ./scripts/sql/migration/reset-db/60_cardano-graphql:/migrations/reset/
      - ./scripts/sql/rpc/60_cardano-graphql:/migrations/apply/
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"


